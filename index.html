<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="assets/ui/flower_icon.png">
<title>Flowers in January</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Noto+Naskh+Arabic:wght@400;500&display=swap" rel="stylesheet">
<link rel="preload" href="assets/ui/PixelAE-Regular.ttf?v=3" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="css/style.css?v=4">
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>
<div id="game"></div>

<!-- Title -->
<div id="title" class="screen">
  <div id="title-art">
    <div id="title-plaque" role="img" aria-label="Flowers in January"></div>
  </div>
  <div id="title-press" class="blink">Press any key</div>
  <div id="title-menu" class="hidden">
    <button class="menu-btn" data-act="continue">Continue</button>
    <button class="menu-btn" data-act="new">New game</button>
  </div>
</div>

<!-- Intro (the original intro screen) -->
<div id="intro" class="hidden">
  <p class="iline" id="il0"></p>
  <p class="iline" id="il1"></p>
  <p class="iline" id="il2"></p>
  <p class="iline" id="il3"></p>
  <p class="iline sm" id="il_skip">press any key to begin</p>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="hud-flowers" title="Flowers"><span class="px-icon flower-icon"></span><span id="hud-fn">0</span>&nbsp;/ 24</div>
  <div id="area-lbl"></div>
  <div id="hud-right">
    <button id="inv-btn" class="hud-btn" title="Inventory (I)">Bag</button>
    <button id="mus-btn" class="hud-btn">&#9834; Music</button>
  </div>
</div>
<div id="popups"></div>

<!-- Dialogue box (Undertale style) -->
<div id="dlg" class="hidden">
  <div id="dlg-name" class="hidden"></div>
  <div id="dlg-box"><div id="dlg-body"></div><div id="dlg-next"></div></div>
</div>

<!-- Inventory -->
<div id="inv" class="ov">
  <div id="inv-panel" class="nine">
    <div class="panel-title">Bag</div>
    <div id="inv-grid"></div>
    <div id="inv-desc">&nbsp;</div>
    <div class="panel-hint">Arrows to choose · E to use · I or Esc to close</div>
  </div>
</div>

<!-- Flower book (click the flower counter) -->
<div id="flw" class="ov">
  <div id="flw-panel" class="nine">
    <div class="panel-title">Flowers <span id="flw-count"></span></div>
    <div id="flw-grid"></div>
    <div id="flw-desc">&nbsp;</div>
    <div class="panel-hint">Arrows to choose · E to read · Esc to close</div>
  </div>
</div>

<!-- Note -->
<div id="note-ov" class="ov">
  <div id="note-bk">
    <div id="note-date">June 18th</div>
    <div id="note-num"></div>
    <div id="note-text"></div>
    <div id="note-nav">
      <button id="note-prev">&#9664;</button>
      <span id="note-pnum">1/3</span>
      <button id="note-next">&#9654;</button>
    </div>
  </div>
</div>

<!-- Poem (pink UI) -->
<div id="poem-ov" class="ov">
  <div id="poem-card">
    <button class="ov-x" id="poem-x">&times;</button>
    <div id="poem-dt"></div><div id="poem-ti"></div><div id="poem-bd"></div>
    <div id="poem-ft">E or click outside to close</div>
  </div>
</div>

<!-- Gate panel -->
<div id="gate-ov" class="ov">
  <div id="gate-panel">
    <div id="gate-slots"></div>
    <div id="gate-hintrow" class="hidden"></div>
    <div id="gate-fields"></div>
    <div id="gate-msg"></div>
  </div>
</div>

<!-- Fade layer -->
<div id="fade"></div>

<!-- Touch controls -->
<div id="touch" class="hidden">
  <div id="dpad">
    <button data-k="up" class="tbtn t-up">&#9650;</button>
    <button data-k="left" class="tbtn t-left">&#9664;</button>
    <button data-k="right" class="tbtn t-right">&#9654;</button>
    <button data-k="down" class="tbtn t-down">&#9660;</button>
  </div>
  <div id="tact">
    <button data-k="inv" class="tbtn t-inv">Bag</button>
    <button data-k="act" class="tbtn t-act">E</button>
  </div>
</div>

<div id="debug-panel" class="hidden"></div>

<script src="js/data.js"></script>
<script src="js/dialogue.js"></script>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/ui/fade.js"></script>
<script src="js/ui/hud.js"></script>
<script src="js/ui/dialogue_box.js"></script>
<script src="js/ui/poem.js"></script>
<script src="js/ui/note.js"></script>
<script src="js/ui/inventory.js"></script>
<script src="js/ui/flowers.js"></script>
<script src="js/ui/gate.js"></script>
<script src="js/ui/title.js"></script>
<script src="js/ui/touch.js"></script>
<script src="js/ui/credits.js"></script>
<script src="js/world/mapbuilder.js"></script>
<script src="js/world/actors.js"></script>
<script src="js/world/player.js"></script>
<script src="js/world/lighting.js"></script>
<script src="js/world/digmarks.js"></script>
<script src="js/story/lines.js"></script>
<script src="js/story/runner.js"></script>
<script src="js/story/garden.js"></script>
<script src="js/story/guardian.js"></script>
<script src="js/story/beach.js"></script>
<script src="js/story/forest.js"></script>
<script src="js/story/blossom.js"></script>
<script src="js/story/plains.js"></script>
<script src="js/story/ending.js"></script>
<script src="js/minigames/fishing.js"></script>
<script src="js/minigames/dig.js"></script>
<script src="js/minigames/whack.js"></script>
<script src="js/minigames/sled.js"></script>
<script src="js/minigames/sleeves.js"></script>
<script src="js/minigames/shuffle.js"></script>
<script src="js/scenes/audio_scene.js"></script>
<script src="js/scenes/boot.js"></script>
<script src="js/scenes/world.js"></script>
<script src="js/debug.js"></script>
<script src="js/main.js"></script>
</body>
</html>
